services:
  - type: web
    name: timbaktu-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install --include=dev && npm run build --workspace=@timbaktu/shared && npm run build --workspace=@timbaktu/api
    startCommand: npm run start --workspace=@timbaktu/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: STORAGE_PROVIDER
        value: local
